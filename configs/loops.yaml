active_learning:
  enabled: true
  max_rounds: 3
  samples_per_round: 300
  uncertainty: margin
  stop_if_macro_f1_gain_below: 0.01
hard_negatives:
  enabled: true
  max_rounds: 2
  oversample_factor: 3
disambiguation:
  tau: 0.20
  max_probes: 2
escalation:
  max_strategies_per_misconception: 3
  on_exhausted: flag_for_human
spaced_retest:
  intervals_attempts: [3, 8, 20]
  stop_after_consecutive_passes: 2
strategy_selection:
  method: epsilon_greedy
  epsilon: 0.15
  min_trials_before_exploit: 5
llm_cache:
  enabled: true
  target_hit_rate: 0.7
dev_gate:
  fail_fast: true
