seed: 42
paths:
  content_dir: content
  data_dir: data
  models_dir: models
  reports_dir: reports
data:
  target_per_label: 200
  val_templates_per_misconception: 1
  test_templates_per_misconception: 1
  min_total_samples: 2000
  max_class_imbalance: 2.0
baseline:
  word_ngram_max: 2
  char_ngram_min: 3
  char_ngram_max: 5
  C: 4.0
  max_iter: 2000
  min_macro_f1: 0.6
diagnosis:
  top_k: 3
  confident_threshold: 0.5
  working_conflict_threshold: 0.7
disambiguation:
  max_probes: 2
  answer_noise: 0.1
  min_expected_gain: 0.05
  prior_floor: 0.01
intervention:
  max_words: 250
  llm_personalize: false
escalation:
  max_strategies_per_misconception: 3
assessment:
  transfer_count: 3
  trap_count: 1
  transfer_pass_min: 2
  retest_gap: 3
  resolved_posterior_max: 0.25
learner:
  prior_alpha: 1.0
  prior_beta: 1.0
  pass_beta_increment: 2.0
  fail_alpha_increment: 1.0
open_set:
  target_false_flag: 0.1
  energy_temperature: 1.0
  runtime_scores: [msp, energy]
app:
  db_env: RELEARN_DB
  db_filename: relearn.db
embedding:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  C: 4.0
  max_iter: 3000
  try_gradient_boosting: true
  exemplars_per_class: 25
mastery:
  prior_alpha: 1.0
  prior_beta: 1.0
  decay: 0.97
  correct: 1.0
  wrong: 1.0
  misconception_weight: 1.0
  probe: 0.5
  transfer_correct: 1.5
  transfer_wrong: 1.0
  trap_pass: 2.0
  trap_fail: 2.0
  retest_pass: 2.0
  retest_fail: 2.0
  difficulty_weight:
    easy: 0.6
    medium: 1.0
    hard: 1.4
difficulty:
  easy_below: 0.4
  hard_above: 0.7
  recent_window: 3
  min_templates_per_band: 2
