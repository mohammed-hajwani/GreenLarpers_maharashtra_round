explanations:
  - {misconception: M01, holds: false, text: "No. If nothing slows it down it keeps going at the same speed by itself, so no force is needed."}
  - {misconception: M01, holds: true, text: "Yes, you always need a force pushing it forward or it will slow down and stop."}
  - {misconception: M02, holds: false, text: "No, without air everything falls with the same acceleration g, so they land together."}
  - {misconception: M02, holds: true, text: "Yes, heavier things fall faster because gravity pulls harder on them."}
  - {misconception: M03, holds: false, text: "At the top the speed is zero but gravity still pulls it down, so the acceleration is still g."}
  - {misconception: M03, holds: true, text: "At the top it stops for a moment so the acceleration is zero there."}
  - {misconception: M04, holds: false, text: "Acceleration is how quickly the velocity changes, so a fast car at a steady speed has no acceleration."}
  - {misconception: M04, holds: true, text: "Acceleration is basically how fast you are going, so faster means more acceleration."}
  - {misconception: M05, holds: false, text: "Because they act on two different objects, so they can't cancel each other."}
  - {misconception: M05, holds: true, text: "They do cancel because they are equal and opposite forces on the same thing."}
  - {misconception: M06, holds: false, text: "No, the normal force is whatever the surface needs to push, so on a ramp or with an extra push it changes."}
  - {misconception: M06, holds: true, text: "Yes, the normal force is always the same as the weight of the object."}
  - {misconception: M07, holds: false, text: "Mass is how much stuff something has in kg, weight is the gravity force on it in newtons."}
  - {misconception: M07, holds: true, text: "Mass and weight are the same thing, both measured in kilograms."}
  - {misconception: M08, holds: false, text: "A real force like tension or friction does the job, centripetal is just the name for that inward force."}
  - {misconception: M08, holds: true, text: "There is the tension plus an extra centripetal force that keeps it in the circle."}
  - {misconception: M09, holds: false, text: "Nothing is pushing it anymore, it keeps moving because of inertia and only gravity acts on it."}
  - {misconception: M09, holds: true, text: "The force from my hand stays in the ball and keeps pushing it until it runs out."}
  - {misconception: M10, holds: false, text: "It turns into heat from friction and sound, the total energy stays the same."}
  - {misconception: M10, holds: true, text: "The energy gets used up by friction and is gone."}
  - {misconception: M11, holds: false, text: "They push on each other equally hard, the small one just accelerates more because it has less mass."}
  - {misconception: M11, holds: true, text: "The big one pushes harder because it is heavier and stronger."}
  - {misconception: M12, holds: false, text: "No, the net force shows how the velocity changes, like gravity pointing down while a ball rises."}
  - {misconception: M12, holds: true, text: "Yes, the net force always points in the same direction the object is moving."}
